[project]
name = "nflsoj-archive"
version = "1.1.0"
description = "NFLSOJ 命令行工具：同步比赛与题目、标记做题进度、把比赛与题面归档成本地 Markdown"
readme = "README.md"
authors = [
    { name = "xiaoniu142857", email = "xiaoniu142857@163.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
nflsoj = "nflsoj_archive:main"
nflsoj-archive = "nflsoj_archive:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
